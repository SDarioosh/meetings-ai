[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetings-server"
version = "0.1.0"
description = "Meetings.ai server: local transcription, speaker detection and LLM meeting summaries"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
diarize = ["pyannote.audio>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
meetings = "meetings_server.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["meetings_server"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "meetings_server/_templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
